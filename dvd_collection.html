<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Movie Collection</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #141414;
        --card-bg: #2b2b2b;
        --text: #e5e5e5;
        --accent: #f5c518;
        --card-size: 280px;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sleek Dark Scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #444 var(--bg);
      }

      .sidebar {
        width: 300px;
        background-color: #1f1f1f;
        padding: 20px;
        overflow-y: auto;
        border-right: 1px solid #333;
        flex-shrink: 0;
        transition: margin-left 0.3s ease;
        margin-left: 0;
        z-index: 1000;
      }
      .sidebar.hidden {
        margin-left: -300px;
      }

      .sidebar h2 {
        margin-top: 0;
        color: #fff;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 10px;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 15px;
        color: var(--accent);
        text-decoration: none;
        font-weight: bold;
        font-size: 0.9em;
      }
      .back-link:hover {
        text-decoration: underline;
      }

      .close-mobile-btn {
        display: none;
      }

      .control-group {
        margin-bottom: 20px;
      }
      .control-group label.group-label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #ccc;
        font-size: 0.9em;
      }
      select,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #444;
        background: #333;
        color: #fff;
      }
      input[type="text"]::placeholder {
        color: #888;
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input[type="range"] {
        flex-grow: 1;
        cursor: pointer;
      }
      .slider-val {
        background: #444;
        padding: 3px 8px;
        border-radius: 4px;
        font-weight: bold;
        min-width: 30px;
        text-align: center;
      }

      .genre-logic {
        background: #333;
        padding: 8px;
        border-radius: 5px;
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 0.85em;
      }
      .genre-logic label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        margin: 0;
        font-weight: normal;
        color: #eee;
      }

      .genre-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .genre-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.85em;
        cursor: pointer;
      }
      .genre-item input {
        cursor: pointer;
      }

      .main-content {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .header-top {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }
      .header-top h1 {
        margin: 0;
        color: #fff;
        font-size: 1.8em;
      }

      .toggle-btn-header {
        background: #222;
        border: 1px solid #555;
        color: #fff;
        padding: 5px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1.5em;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toggle-btn-header:hover {
        background: #444;
        border-color: var(--accent);
        color: var(--accent);
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 20px;
        background: #1f1f1f;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid #333;
        flex-wrap: wrap;
        margin-bottom: 25px;
      }
      .movie-count {
        font-size: 1.1em;
        color: var(--accent);
        font-weight: bold;
        border-right: 1px solid #444;
        padding-right: 20px;
      }
      .size-control {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9em;
        color: #ccc;
      }

      .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--card-size), 1fr));
        gap: 20px;
        align-items: start;
      }

      .movie-card {
        background-color: var(--card-bg);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        transition: transform 0.2s;
        cursor: pointer;
      }
      .movie-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(245, 197, 24, 0.2);
        border: 1px solid #555;
      }

      .cover-img {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        background-color: #000;
      }

      .movie-info {
        padding: 15px;
        display: flex;
        flex-direction: column;
      }
      .title {
        font-size: 1.1em;
        font-weight: bold;
        color: #fff;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        font-size: 0.8em;
        color: #aaa;
        margin-bottom: 10px;
        display: flex;
        gap: 5px;
        flex-wrap: nowrap;
        overflow: hidden;
      }
      .meta span {
        background: #444;
        padding: 2px 6px;
        border-radius: 4px;
        color: #fff;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .genres {
        font-size: 0.8em;
        color: #888;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* =========================================
           🔥 NEW OVERLAY MODAL STYLES
           ========================================= */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 3000;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        padding: 20px;
        backdrop-filter: blur(5px);
      }
      .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-content {
        display: flex;
        background: var(--card-bg);
        border-radius: 12px;
        max-width: 900px;
        width: 100%;
        max-height: 90vh;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        transform: scale(0.95);
        transition: transform 0.3s ease;
      }
      .modal-overlay.show .modal-content {
        transform: scale(1);
      }

      .modal-close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #555;
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 1.2em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .modal-close-btn:hover {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }

      .modal-img {
        width: 350px;
        flex-shrink: 0;
        object-fit: cover;
        background: #000;
      }

      .modal-details {
        padding: 40px 30px;
        overflow-y: auto;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .modal-title {
        font-size: 2em;
        font-weight: bold;
        color: #fff;
        margin: 0 0 10px 0;
        line-height: 1.2;
      }
      .modal-meta {
        font-size: 0.9em;
        color: #aaa;
        margin-bottom: 20px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .modal-meta span {
        background: #444;
        padding: 4px 8px;
        border-radius: 4px;
        color: #fff;
      }
      .modal-genres {
        font-size: 1em;
        color: var(--accent);
        margin-bottom: 20px;
        font-weight: bold;
      }
      .modal-plot {
        font-size: 1em;
        line-height: 1.6;
        margin-bottom: 25px;
        color: #ddd;
      }
      .modal-credits {
        font-size: 0.9em;
        color: #aaa;
        line-height: 1.8;
        margin-bottom: 25px;
        background: #222;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333;
      }
      .modal-credits strong {
        color: #fff;
      }

      .modal-imdb-btn {
        display: inline-block;
        padding: 12px 25px;
        background-color: var(--accent);
        color: #000;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        text-align: center;
        align-self: flex-start;
        transition: 0.2s;
      }
      .modal-imdb-btn:hover {
        background-color: #e3b616;
        transform: translateY(-2px);
      }

      /* =========================================
           📱 MOBILE OVERRIDES
           ========================================= */
      @media (max-width: 800px) {
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          z-index: 4000;
          border-right: none;
          padding-bottom: 100px;
        }
        .sidebar.hidden {
          margin-left: -100%;
        }
        .close-mobile-btn {
          display: block;
          width: 100%;
          padding: 15px;
          background: var(--accent);
          color: #000;
          border: none;
          border-radius: 5px;
          font-size: 1.1em;
          font-weight: bold;
          cursor: pointer;
          margin-bottom: 20px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .movie-count {
          border-right: none;
          padding-right: 0;
          margin-bottom: 10px;
        }
        .header-controls {
          flex-direction: column;
          align-items: flex-start;
        }

        /* Keep Mobile as a Poster Wall! Hide the small text under the card */
        .movie-info {
          display: none;
        }

        /* Adjust Modal for Mobile Screens */
        .modal-overlay {
          padding: 10px;
        }
        .modal-content {
          flex-direction: column;
          max-height: 95vh;
        }
        .modal-img {
          width: 50%;
          height: auto;
          aspect-ratio: 2 / 3;
          align-self: center;
          margin-top: 20px;
          border-radius: 8px;
        }
        .modal-details {
          padding: 25px 20px;
        }
        .modal-title {
          font-size: 1.5em;
        }
        .modal-imdb-btn {
          width: 100%;
          margin-top: 10px;
          margin-bottom: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <button class="close-mobile-btn" onclick="toggleSidebar()">
        ✕ Apply Filters & Close
      </button>
      <a href="index.html" class="back-link">← Back to Hub</a>
      <h2>Filters & Sorting</h2>

      <div class="control-group">
        <label class="group-label">Search</label>
        <input
          type="text"
          id="searchInput"
          placeholder="Search title, year, cast, plot..."
        />
      </div>

      <div class="control-group">
        <label class="group-label">Sort By</label>
        <select id="sortSelect">
          <option value="title_asc">Title (A-Z)</option>
          <option value="title_desc">Title (Z-A)</option>
          <option value="year_desc">Year (Newest First)</option>
          <option value="year_asc">Year (Oldest First)</option>
          <option value="rating_desc">IMDb Rating (High to Low)</option>
          <option value="rating_asc">IMDb Rating (Low to High)</option>
          <option value="duration_desc">Duration (Longest First)</option>
          <option value="duration_asc">Duration (Shortest First)</option>
          <option value="director_asc">Director (A-Z)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="group-label">Minimum IMDb Rating</label>
        <div class="slider-container">
          <input
            type="range"
            id="ratingSlider"
            min="0"
            max="10"
            step="0.1"
            value="0"
          />
          <span id="ratingVal" class="slider-val">0.0</span>
        </div>
      </div>

      <div class="control-group">
        <label class="group-label">Duration (Minutes)</label>
        <div style="display: flex; gap: 10px">
          <input type="number" id="minDuration" placeholder="Min" value="0" />
          <input type="number" id="maxDuration" placeholder="Max" value="300" />
        </div>
      </div>

      <div class="control-group">
        <label class="group-label">Genres</label>
        <div class="genre-logic">
          <label
            ><input type="radio" name="genreLogic" value="OR" checked /> Match
            ANY selected (OR)</label
          >
          <label
            ><input type="radio" name="genreLogic" value="AND" /> Match ALL
            selected (AND)</label
          >
        </div>
        <div class="genre-list" id="genreContainer"></div>
      </div>

      <div class="control-group">
        <label class="group-label">Director</label>
        <select id="directorFilter">
          <option value="">-- All Directors --</option>
        </select>
      </div>

      <div class="control-group">
        <label class="group-label">Actor / Star</label>
        <select id="starFilter">
          <option value="">-- All Stars --</option>
        </select>
      </div>

      <button
        onclick="resetFilters()"
        style="
          width: 100%;
          padding: 10px;
          background: #444;
          color: white;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          margin-top: 10px;
          font-weight: bold;
        "
      >
        Reset All Filters
      </button>
    </div>

    <div class="main-content">
      <div class="header-top">
        <button
          class="toggle-btn-header"
          onclick="toggleSidebar()"
          title="Toggle Sidebar"
        >
          ☰
        </button>
        <h1>My Movie Collection</h1>
      </div>

      <div class="header-controls">
        <div class="movie-count" id="movieCount">0 Movies</div>
        <div class="size-control">
          <label>Card Size:</label>
          <input type="range" id="sizeSlider" min="70" max="400" value="280" />
        </div>
      </div>

      <div class="movie-grid" id="movieGrid">
        <!-- Cards injected by JS -->
      </div>
    </div>

    <!-- 🔥 NEW OVERLAY MODAL HTML -->
    <div class="modal-overlay" id="movieModal" onclick="closeModal(event)">
      <!-- stopPropagation prevents closing when clicking inside the white box -->
      <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close-btn" onclick="closeModal()">✕</button>

        <div class="modal-details">
          <img
            class="modal-img"
            id="modalImg"
            src=""
            alt="Cover"
            onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/000000/FFFFFF/?text=No+Cover';"
          />
          <br />
          <h2 class="modal-title" id="modalTitle">Title</h2>
          <div class="modal-meta" id="modalMeta"></div>
          <div class="modal-genres" id="modalGenres"></div>
          <div class="modal-plot" id="modalPlot"></div>

          <div class="modal-credits" id="modalCredits"></div>

          <a id="modalLink" href="#" target="_blank" class="modal-imdb-btn"
            >View on IMDb</a
          >
        </div>
      </div>
    </div>

    <script src="data.js"></script>

    <script>
      const sidebar = document.getElementById("sidebar");
      const grid = document.getElementById("movieGrid");
      const countDisplay = document.getElementById("movieCount");
      const searchInput = document.getElementById("searchInput");
      const sortSelect = document.getElementById("sortSelect");
      const ratingSlider = document.getElementById("ratingSlider");
      const ratingVal = document.getElementById("ratingVal");
      const minDuration = document.getElementById("minDuration");
      const maxDuration = document.getElementById("maxDuration");
      const genreContainer = document.getElementById("genreContainer");
      const logicRadios = document.querySelectorAll('input[name="genreLogic"]');
      const directorFilter = document.getElementById("directorFilter");
      const starFilter = document.getElementById("starFilter");
      const sizeSlider = document.getElementById("sizeSlider");
      const modal = document.getElementById("movieModal");

      // --- MOBILE INITIALIZATION ---
      if (window.innerWidth <= 800) {
        sidebar.classList.add("hidden");
        document.documentElement.style.setProperty("--card-size", "140px");
        sizeSlider.value = 140;
      }

      window.toggleSidebar = function () {
        sidebar.classList.toggle("hidden");
      };

      sizeSlider.addEventListener("input", (e) => {
        document.documentElement.style.setProperty(
          "--card-size",
          `${e.target.value}px`
        );
      });

      // --- 🔥 MODAL OVERLAY LOGIC ---
      window.openModal = function (imdbId) {
        // Find the exact movie object from our database
        const m = allMovies.find((movie) => movie.imdb_id === imdbId);
        if (!m) return;

        // Populate Modal Data
        document.getElementById("modalImg").src = m.img_uri;
        document.getElementById("modalTitle").textContent = `${m.title} (${
          m.year > 0 ? m.year : "?"
        })`;
        document.getElementById("modalMeta").innerHTML = `
                <span>⭐ ${m.imdb_rating_str}</span>
                <span>${m.fsk_rating}</span>
                <span>${m.duration_str}</span>
            `;
        document.getElementById("modalGenres").textContent = m.genres_str;
        document.getElementById("modalPlot").textContent = m.outline;
        document.getElementById("modalCredits").innerHTML = `
                <strong>Director:</strong> ${m.director}<br><br>
                <strong>Stars:</strong> ${m.stars}
            `;
        document.getElementById(
          "modalLink"
        ).href = `https://www.imdb.com/title/${m.imdb_id}/`;

        // Show Modal & Lock background scrolling
        modal.classList.add("show");
        document.body.style.overflow = "hidden";
      };

      window.closeModal = function (event) {
        // If event is provided, only close if the background overlay was clicked
        if (event && event.target !== modal) return;

        modal.classList.remove("show");
        document.body.style.overflow = ""; // Restore background scrolling
      };

      // Close Modal with the ESC key
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          // Call closeModal without an event so it bypasses the click check
          closeModal();
        }
      });

      function initFilters() {
        allGenres.forEach((genre) => {
          const label = document.createElement("label");
          label.className = "genre-item";
          label.innerHTML = `<input type="checkbox" value="${genre}" class="genre-checkbox"> ${genre}`;
          genreContainer.appendChild(label);
        });
        document.querySelectorAll(".genre-checkbox").forEach((cb) => {
          cb.addEventListener("change", updateGallery);
        });

        allDirectors.forEach((director) => {
          const opt = document.createElement("option");
          opt.value = director;
          opt.textContent = director;
          directorFilter.appendChild(opt);
        });
        directorFilter.addEventListener("change", updateGallery);

        allStars.forEach((star) => {
          const opt = document.createElement("option");
          opt.value = star;
          opt.textContent = star;
          starFilter.appendChild(opt);
        });
        starFilter.addEventListener("change", updateGallery);
      }

      function renderMovies(movies) {
        grid.innerHTML = "";
        countDisplay.textContent = `${movies.length} Movie${
          movies.length !== 1 ? "s" : ""
        }`;

        movies.forEach((movie) => {
          const fullTitle = `${movie.title} (${
            movie.year > 0 ? movie.year : "?"
          })`;

          const card = document.createElement("div");
          card.className = "movie-card";
          // The entire card is now clickable and triggers the popup!
          card.setAttribute("onclick", `openModal('${movie.imdb_id}')`);

          card.innerHTML = `
                    <img src="${movie.img_uri}" class="cover-img" alt="Cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/000000/FFFFFF/?text=No+Cover';">
                    <div class="movie-info">
                        <div class="title" title="${fullTitle}">${fullTitle}</div>
                        <div class="meta">
                            <span>⭐ ${movie.imdb_rating_str}</span>
                            <span>${movie.fsk_rating}</span>
                            <span>${movie.duration_str}</span>
                        </div>
                        <div class="genres" title="${movie.genres_str}">${movie.genres_str}</div>
                    </div>
                `;
          grid.appendChild(card);
        });
      }

      function updateGallery() {
        const searchQuery = searchInput.value.toLowerCase().trim();
        const minRat = parseFloat(ratingSlider.value);
        const minDur = parseInt(minDuration.value) || 0;
        const maxDur = parseInt(maxDuration.value) || 9999;

        const checkedGenres = Array.from(
          document.querySelectorAll(".genre-checkbox:checked")
        ).map((cb) => cb.value);
        const genreLogic = document.querySelector(
          'input[name="genreLogic"]:checked'
        ).value;

        const selDirector = directorFilter.value;
        const selStar = starFilter.value;

        let filtered = allMovies.filter((m) => {
          if (searchQuery) {
            const inTitle = m.title.toLowerCase().includes(searchQuery);
            const inYear = String(m.year).includes(searchQuery);
            const inOutline = m.outline.toLowerCase().includes(searchQuery);
            const inDirector = m.director.toLowerCase().includes(searchQuery);
            const inStars = m.stars.toLowerCase().includes(searchQuery);
            if (!inTitle && !inYear && !inOutline && !inDirector && !inStars)
              return false;
          }

          if (m.imdb_rating_val < minRat) return false;
          if (
            m.duration_min > 0 &&
            (m.duration_min < minDur || m.duration_min > maxDur)
          )
            return false;
          if (selDirector && !m.director.includes(selDirector)) return false;
          if (selStar && !m.stars.includes(selStar)) return false;

          if (checkedGenres.length > 0) {
            if (genreLogic === "OR") {
              if (!checkedGenres.some((g) => m.genres_list.includes(g)))
                return false;
            } else if (genreLogic === "AND") {
              if (!checkedGenres.every((g) => m.genres_list.includes(g)))
                return false;
            }
          }

          return true;
        });

        const sortRules = sortSelect.value.split("_");
        const sortField = sortRules[0];
        const sortDir = sortRules[1];

        filtered.sort((a, b) => {
          let valA, valB;
          if (sortField === "title") {
            valA = a.title.toLowerCase();
            valB = b.title.toLowerCase();
          } else if (sortField === "year") {
            valA = a.year;
            valB = b.year;
          } else if (sortField === "rating") {
            valA = a.imdb_rating_val;
            valB = b.imdb_rating_val;
          } else if (sortField === "duration") {
            valA = a.duration_min;
            valB = b.duration_min;
          } else if (sortField === "director") {
            valA = a.director.toLowerCase();
            valB = b.director.toLowerCase();
          }

          if (valA < valB) return sortDir === "asc" ? -1 : 1;
          if (valA > valB) return sortDir === "asc" ? 1 : -1;
          return 0;
        });

        renderMovies(filtered);
      }

      function resetFilters() {
        searchInput.value = "";
        sortSelect.value = "title_asc";
        ratingSlider.value = 0;
        ratingVal.textContent = "0.0";
        minDuration.value = 0;
        maxDuration.value = 300;
        directorFilter.value = "";
        starFilter.value = "";

        document
          .querySelectorAll(".genre-checkbox")
          .forEach((cb) => (cb.checked = false));
        document.querySelector(
          'input[name="genreLogic"][value="OR"]'
        ).checked = true;
        updateGallery();
      }

      searchInput.addEventListener("input", updateGallery);
      sortSelect.addEventListener("change", updateGallery);
      ratingSlider.addEventListener("input", (e) => {
        ratingVal.textContent = parseFloat(e.target.value).toFixed(1);
        updateGallery();
      });
      minDuration.addEventListener("input", updateGallery);
      maxDuration.addEventListener("input", updateGallery);
      logicRadios.forEach((radio) =>
        radio.addEventListener("change", updateGallery)
      );

      initFilters();
      updateGallery();
    </script>
  </body>
</html>
